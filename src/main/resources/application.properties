spring.application.name=learner_management

server.port=8090
# Enable the H2 console
spring.h2.console.enabled=true

# Specify the path for the H2 console (default is /h2-console)
spring.h2.console.path=/h2-console

# Configure database connection details (in-memory mode)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=user
spring.datasource.password=user

# Configure Hibernate to automatically update the database schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
